# MestReNova isn't redistributable, so install the RPM by hand after assembling
# (and again after any re-assemble, since replace=true recreates the container):
#   distrobox enter mnova -- sudo dnf install -y ./MestReNova-*.x86_64.rpm
#   distrobox enter mnova -- distrobox-export --app MestReNova
# The CU campus license checks ucb-licenses.colorado.edu, so connect to the CU VPN off campus.
[mnova]
image=quay.io/toolbx-images/rockylinux-toolbox:9
pull=true
replace=true
pre_init_hooks=dnf install -y epel-release
additional_packages="libquadmath xdg-utils"
