# MestReNova isn't redistributable, so the RPM has to be installed by hand
#   distrobox enter mnova -- sudo dnf install -y ./MestReNova-*.x86_64.rpm
#   distrobox enter mnova -- distrobox-export --app MestReNova
[mnova]
image=quay.io/toolbx-images/rockylinux-toolbox:9
pull=true
replace=true
pre_init_hooks=dnf install -y epel-release
additional_packages="libquadmath xdg-utils"
