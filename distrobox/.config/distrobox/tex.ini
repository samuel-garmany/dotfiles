[tex]
image=ghcr.io/ublue-os/fedora-toolbox:latest
pull=true
replace=true
additional_packages="texlive-scheme-full pandoc-cli poppler-utils"
init_hooks=curl -fsSL https://github.com/typst/typst/releases/latest/download/typst-x86_64-unknown-linux-musl.tar.xz | tar -xJ -C /usr/local/bin --strip-components=1 --wildcards '*/typst'
