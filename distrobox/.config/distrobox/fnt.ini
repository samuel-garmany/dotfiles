[fnt]
image=ghcr.io/ublue-os/fedora-toolbox:latest
pull=true
replace=true
# The uBlue image excludes mesa-* to keep its own Mesa, which also blocks
# mesa-libGLU (a separate library ffmpeg-free needs via libcaca). Install it
# past the exclude first. Hooks are eval'd on the host first, so no globs.
pre_init_hooks=dnf install -y --setopt=fedora.excludepkgs= --setopt=updates.excludepkgs= mesa-libGLU
additional_packages="python3 python3-devel python3-pip python3-qt5 uv ffmpeg-free git gcc gcc-c++"
