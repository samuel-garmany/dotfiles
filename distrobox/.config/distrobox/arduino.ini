# The serial port is root:dialout on the host, so add yourself there once:
#   sudo usermod -aG dialout $USER
[arduino]
image=ghcr.io/ublue-os/fedora-toolbox:latest
pull=true
replace=true
additional_packages="git"
init_hooks=curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=/usr/local/bin sh
