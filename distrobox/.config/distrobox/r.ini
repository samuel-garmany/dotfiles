# rocker images aren't signed, so secureblue's container policy rejects them.
[r]
image=ghcr.io/ublue-os/ubuntu-toolbox:latest
pull=true
replace=true
# CRAN only ships source on Linux; the -dev libraries are what tidyverse compiles against
additional_packages="r-base r-base-dev curl libsecret-1-0 libcurl4-openssl-dev libssl-dev libxml2-dev libuv1-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype-dev libpng-dev libtiff-dev libjpeg-dev libwebp-dev"
# Posit has no stable "latest" link, so take the .deb link from the download page.
# Hooks are eval'd on the host first, so no quotes or $ here.
init_hooks=command -v positron >/dev/null || { curl -fsSL https://positron.posit.co/download.html | grep -oE https://cdn.posit.co/positron/releases/deb/x86_64/Positron-[0-9.-]+-x64.deb | head -n1 | xargs curl -fsSL -o /tmp/positron.deb && apt-get install -y /tmp/positron.deb && rm -f /tmp/positron.deb; }
exported_apps="positron"
