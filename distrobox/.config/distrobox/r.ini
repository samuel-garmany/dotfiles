# rocker images aren't signed, so secureblue's container policy rejects them.
[r]
image=ghcr.io/ublue-os/ubuntu-toolbox:latest
pull=true
replace=true
# RStudio's .deb doesn't declare Electron's NSS and ALSA libraries
additional_packages="r-base r-base-dev curl libnss3 libasound2t64"
# Posit only builds the desktop .deb for jammy; it installs on newer Ubuntu too
init_hooks=command -v rstudio >/dev/null || { curl -fsSL -o /tmp/rstudio.deb https://rstudio.org/download/latest/stable/desktop/jammy/rstudio-latest-amd64.deb && apt-get install -y /tmp/rstudio.deb && rm -f /tmp/rstudio.deb; }
exported_apps="rstudio"
